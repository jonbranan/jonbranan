<text x="20" y="304.9" xml:space="preserve"><tspan fill="#7c8798"> 6</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#38bdf8">container         </tspan><tspan fill="#7c8798"> 13.115 ms  13.002 ms  13.240 ms</tspan></text>
<text x="20" y="346.9" xml:space="preserve"><tspan fill="#22c55e">jonathan@core</tspan><tspan fill="#c9d1d9">:</tspan><tspan fill="#38bdf8">~</tspan><tspan fill="#7c8798">$</tspan><tspan fill="#c9d1d9"> man jonathan</tspan></text>
<text x="20" y="367.9" xml:space="preserve"><tspan fill="#7c8798">JONATHAN(1)           General Commands Manual          JONATHAN(1)</tspan></text>
<text x="20" y="409.9" xml:space="preserve"><tspan fill="#38bdf8">NAME</tspan></text>
<text x="20" y="430.9" xml:space="preserve"><tspan fill="#c9d1d9">       jonathan - software engineer</tspan></text>
<text x="20" y="472.9" xml:space="preserve"><tspan fill="#38bdf8">SYNOPSIS</tspan></text>
<text x="20" y="493.9" xml:space="preserve"><tspan fill="#c9d1d9">       jonathan [--homelab] [--family] [--travel]</tspan></text>
<text x="20" y="535.9" xml:space="preserve"><tspan fill="#38bdf8">DESCRIPTION</tspan></text>
<text x="20" y="556.9" xml:space="preserve"><tspan fill="#c9d1d9">       Jonathan Branan is a Software Engineer.  He is mostly</tspan></text>
<text x="20" y="577.9" xml:space="preserve"><tspan fill="#c9d1d9">       self-taught, though he did attend a vocational class at</tspan></text>
<text x="20" y="598.9" xml:space="preserve"><tspan fill="#c9d1d9">       Rackspace Open Cloud Academy.  He has worked for Geek</tspan></text>
<text x="20" y="619.9" xml:space="preserve"><tspan fill="#c9d1d9">       Squad repairing computers, GlobalScape as a Lead of the</tspan></text>
<text x="20" y="640.9" xml:space="preserve"><tspan fill="#c9d1d9">       Client Services department, a Product Owner of MFT</tspan></text>
<text x="20" y="661.9" xml:space="preserve"><tspan fill="#c9d1d9">       applications, and as a Software Engineer at Fortra.  He</tspan></text>
<text x="20" y="682.9" xml:space="preserve"><tspan fill="#c9d1d9">       is currently a Technical Account Manager at Teramind.</tspan></text>
<text x="20" y="724.9" xml:space="preserve"><tspan fill="#38bdf8">ENVIRONMENT</tspan></text>
<text x="20" y="745.9" xml:space="preserve"><tspan fill="#c9d1d9">       HOME      San Antonio, TX - wife, daughter, two dogs</tspan></text>
<text x="20" y="766.9" xml:space="preserve"><tspan fill="#c9d1d9">       HOBBIES   basketball, video games, cooking, camping,</tspan></text>
<text x="20" y="787.9" xml:space="preserve"><tspan fill="#c9d1d9">                 kayaking, movies, mixed drinks, Lego</tspan></text>
<text x="20" y="808.9" xml:space="preserve"><tspan fill="#c9d1d9">       TRAVEL    frequently, with his wife</tspan></text>
<text x="20" y="850.9" xml:space="preserve"><tspan fill="#38bdf8">SEE ALSO</tspan></text>
<text x="20" y="871.9" xml:space="preserve"><tspan fill="#c9d1d9">       git(1), docker(1), journalctl(1)</tspan></text>
<text x="20" y="913.9" xml:space="preserve"><tspan fill="#7c8798">                                                       JONATHAN(1)</tspan></text>
</g>
