<text x="20" y="31.9" xml:space="preserve"><tspan fill="#22c55e">jonathan@core</tspan><tspan fill="#c9d1d9">:</tspan><tspan fill="#38bdf8">~</tspan><tspan fill="#7c8798">$</tspan><tspan fill="#c9d1d9"> whoami</tspan></text>
<text x="20" y="52.9" xml:space="preserve"><tspan fill="#c9d1d9">Jonathan Branan — </tspan><tspan fill="#f59e0b">technical account manager</tspan><tspan fill="#c9d1d9"> at Teramind</tspan></text>
<text x="20" y="94.9" xml:space="preserve"><tspan fill="#22c55e">jonathan@core</tspan><tspan fill="#c9d1d9">:</tspan><tspan fill="#38bdf8">~</tspan><tspan fill="#7c8798">$</tspan><tspan fill="#c9d1d9"> uptime</tspan></text>
<text x="20" y="115.9" xml:space="preserve"><tspan fill="#c9d1d9">up </tspan><tspan fill="#f59e0b">7</tspan><tspan fill="#c9d1d9"> hosts · </tspan><tspan fill="#f59e0b">76</tspan><tspan fill="#c9d1d9"> stacks · </tspan><tspan fill="#f59e0b">1</tspan><tspan fill="#c9d1d9"> very patient wife</tspan></text>
<text x="20" y="157.9" xml:space="preserve"><tspan fill="#22c55e">jonathan@core</tspan><tspan fill="#c9d1d9">:</tspan><tspan fill="#38bdf8">~</tspan><tspan fill="#7c8798">$</tspan><tspan fill="#c9d1d9"> traceroute jonb.io</tspan></text>
<text x="20" y="178.9" xml:space="preserve"><tspan fill="#7c8798">traceroute to jonb.io (198.23.237.22), 30 hops max, 60 byte packets</tspan></text>
<text x="20" y="199.9" xml:space="preserve"><tspan fill="#7c8798"> 1</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#38bdf8">internet          </tspan><tspan fill="#7c8798">  0.412 ms   0.388 ms   0.401 ms</tspan></text>
<text x="20" y="220.9" xml:space="preserve"><tspan fill="#7c8798"> 2</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#38bdf8">cloudflare        </tspan><tspan fill="#7c8798">  1.204 ms   1.188 ms   1.231 ms</tspan></text>
<text x="20" y="241.9" xml:space="preserve"><tspan fill="#7c8798"> 3</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#38bdf8">pangolin (vps)    </tspan><tspan fill="#7c8798">  8.771 ms   8.640 ms   8.902 ms</tspan></text>
<text x="20" y="262.9" xml:space="preserve"><tspan fill="#7c8798"> 4</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#38bdf8">newt tunnel       </tspan><tspan fill="#7c8798"> 12.338 ms  12.201 ms  12.455 ms</tspan></text>
